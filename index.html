<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatialized Activity Library</title>
<meta name="description" content="Hands-on spatial reasoning activities for Grades 5–10 math and science, linked to the Ontario curriculum. In English and French.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#results" data-t="skip">Skip to activities</a>
<div class="wrap topbar">
  <div class="langs" role="group" aria-label="Language / Langue">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="fr" aria-pressed="false" lang="fr">Français</button>
  </div>
</div>
<header class="mast">
  <div class="wrap mast-inner">
    <div>
      <h1 data-t="title">Spatialized Activity Library</h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="st-total">0</b><span data-t="stActs"></span></div>
      <div class="stat"><b id="st-exp">0</b><span data-t="stExp"></span></div>
      <div class="stat"><b id="st-fr">0</b><span data-t="stFr"></span></div>
    </div>
  </div>
</header>

<section class="key" aria-labelledby="key-h">
  <div class="wrap">
    <h2 id="key-h" data-t="keyH"></h2>
    <ul id="skill-key"></ul>
  </div>
</section>

<div class="wrap">
<main>
  <aside class="filters" aria-label="Filters" id="filters">
    <div>
      <label class="flabel" for="q" data-t="search"></label>
      <input type="search" id="q" autocomplete="off">
    </div>
    <fieldset><legend data-t="fGrade"></legend><div class="chips" id="f-grade"></div></fieldset>
    <fieldset><legend data-t="fSubj"></legend><div class="chips" id="f-subj"></div></fieldset>
    <fieldset><legend data-t="fSkill"></legend><div class="chips" id="f-skill"></div></fieldset>
    <fieldset><legend data-t="fLang"></legend><div class="chips" id="f-lang"></div></fieldset>
    <button type="button" class="btn" id="reset" data-t="reset"></button>
  </aside>

  <section id="results" aria-labelledby="res-h">
    <div class="results-head">
      <h2 id="res-h" style="font-size:1.25rem" data-t="acts"></h2>
      <p aria-live="polite" id="count"></p>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden data-t="empty"></p>
  </section>
</main>
</div>

<footer>
  <div class="wrap">
    <p data-t="aboutAlign"></p>
    <p data-t="license"></p>
    <p><a href="admin.html" data-t="editLink"></a></p>
  </div>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script src="assets/shared.js"></script>
<script>
const T = {
 en: {
  skip:"Skip to activities", title:"Spatialized Activity Library",
  lede:"Hands-on activities that build spatial reasoning in Grades 5–10 math and science. Each one shows the spatial skills it develops, the Ontario curriculum expectations it supports, and whether it's available in French.",
  stActs:"activities", stExp:"Ontario expectations linked", stFr:"available in French",
  keyH:"Spatial skills in this library", search:"Search", searchPh:"Title, topic, material or code (e.g., E2.5)",
  fGrade:"Grade", fSubj:"Subject", fSkill:"Spatial skill", fLang:"Language", reset:"Clear all filters",
  subj:{math:"Math",sci:"Science",both:"Math + Science"}, frOnly:"Available in French",
  acts:"Activities", showing:(n,t)=>`Showing <strong>${n}</strong> of ${t}`, empty:"No activities match these filters. Try removing a skill or grade.",
  nExp:n=>`${n} Ontario expectation${n===1?"":"s"}`, close:"Close", objectives:"Objectives", materials:"Materials", prep:"Teacher notes",
  skills:"Spatial skills", sciExp:"Ontario science expectations", mathExp:"Ontario math expectations",
  procs:"Thinking processes", sciProc:"Science", mathProc:"Math", concepts:"Science contexts and concepts", resources:"Lesson plan and resources",
  noLink:"Lesson plan link coming soon.", adapted:s=>`Adapted from ${s}.`, type:{general:"For all grades",specific:"Curriculum specific"},
  langAvail:{en:"English only", both:"English and French"},
  aboutAlign:"<strong>About the Ontario alignment.</strong> Expectations are drawn from Science and Technology, Grades 1–8 (2022), Science Grade 9 SNC1W (2022), Science Grade 10 SNC2D (2008), Mathematics Grades 1–8 (2020), Mathematics Grade 9 MTH1W (2021) and Grade 10 MPM2D (2005). Thinking processes refer to the scientific and engineering design processes in Strand A (science) and the seven mathematical processes (math). Wording is abridged; check the official curriculum for full text.",
  license:'Activities created or adapted by Project Spatialize, and this library\'s descriptions, tags and curriculum mapping, are shared under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license noopener" target="_blank">CC BY-NC-SA 4.0</a>. Curated activities from other organizations remain the property of their creators; we link to their original pages. French translations of descriptions are drafts under review.',
  editLink:"Update the library (editors)",
 },
 fr: {
  skip:"Aller aux activités", title:"Bibliothèque d'activités "Spatialisées"",
  lede:"Des activités concrètes pour développer le raisonnement spatial en mathématiques et en sciences, de la 5e à la 10e année. Chaque fiche indique les habiletés spatiales visées, les attentes du curriculum de l'Ontario et la disponibilité en français.",
  stActs:"activités", stExp:"attentes de l'Ontario liées", stFr:"offertes en français",
  keyH:"Habiletés spatiales", search:"Rechercher", searchPh:"Titre, sujet, matériel ou code (p. ex., E2.5)",
  fGrade:"Année", fSubj:"Matière", fSkill:"Habileté spatiale", fLang:"Langue", reset:"Effacer les filtres",
  subj:{math:"Mathématiques",sci:"Sciences",both:"Maths + sciences"}, frOnly:"Offert en français",
  acts:"Activités", showing:(n,t)=>`<strong>${n}</strong> sur ${t}`, empty:"Aucune activité ne correspond à ces filtres. Retirez une habileté ou une année.",
  nExp:n=>`${n} attente${n>1?"s":""} de l'Ontario`, close:"Fermer", objectives:"Objectifs", materials:"Matériel", prep:"Notes pour l'enseignant",
  skills:"Habiletés spatiales", sciExp:"Attentes en sciences (Ontario)", mathExp:"Attentes en mathématiques (Ontario)",
  procs:"Processus de pensée", sciProc:"Sciences", mathProc:"Mathématiques", concepts:"Contextes et concepts scientifiques", resources:"Plan de leçon et ressources",
  noLink:"Lien vers le plan de leçon à venir.", adapted:s=>`Adapté de : ${s}.`, type:{general:"Toutes les années",specific:"Lié au curriculum"},
  langAvail:{en:"Anglais seulement", both:"Anglais et français"},
  aboutAlign:"<strong>Arrimage au curriculum de l'Ontario.</strong> Les attentes proviennent de Sciences et technologie, 1re à 8e année (2022), Sciences 9e année SNC1W (2022), Sciences 10e année SNC2D (2008), Mathématiques 1re à 8e année (2020), Mathématiques 9e année MTH1W (2021) et 10e année MPM2D (2005). Les processus de pensée renvoient aux processus scientifiques et de design en ingénierie du domaine A (sciences) et aux sept processus mathématiques. Libellés abrégés et traduits; consultez le curriculum officiel pour le texte complet.",
  license:'Les activités créées ou adaptées par Project Spatialize, ainsi que les descriptions, étiquettes et arrimages de cette bibliothèque, sont diffusés sous licence <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr" rel="license noopener" target="_blank">CC BY-NC-SA 4.0</a>. Les activités d\'autres organismes demeurent la propriété de leurs auteurs; nous renvoyons à leurs pages d\'origine. Les traductions françaises sont des ébauches en cours de révision.',
  editLink:"Mettre à jour la bibliothèque (éditeurs)",
 }
};
const {SKILLS, icon, skillName, gradesText, expLabel, esc} = SPZ;
let DB = null, lang = "en";
try { const s = localStorage.getItem("spz-lang"); if (s === "fr" || s === "en") lang = s; } catch(e) {}
const $ = s => document.querySelector(s);
const t = k => T[lang][k];
const state = {q:"", grades:new Set(), subj:new Set(), skills:new Set(), fr:false};
const pick = o => (o && (o[lang] || o.en)) || "";

function art(a){
  let h=0; for(const c of a.id) h=(h*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{h=(h*1664525+1013904223)>>>0; return h/4294967296};
  const col=`var(${(SKILLS[a.skills[0]]||{c:"--s9"}).c})`;
  const cells=[]; for(let x=0;x<3;x++)for(let y=0;y<3;y++){const n=Math.floor(rnd()*3.2); for(let z=0;z<n;z++)cells.push([x,y,z]);}
  if(!cells.length) cells.push([1,1,0]);
  cells.sort((p,q)=>(p[0]+p[1])-(q[0]+q[1])||p[2]-q[2]);
  const W=14,H=8,Z=16,ox=50,oy=40; let s="";
  for(const [x,y,z] of cells){ const cx=ox+(x-y)*W, cy=oy+(x+y)*H-z*Z;
    s+=`<polygon points="${cx},${cy-H} ${cx+W},${cy} ${cx},${cy+H} ${cx-W},${cy}" fill="${col}" opacity=".95"/><polygon points="${cx-W},${cy} ${cx},${cy+H} ${cx},${cy+H+Z} ${cx-W},${cy+Z}" fill="${col}" opacity=".7"/><polygon points="${cx+W},${cy} ${cx},${cy+H} ${cx},${cy+H+Z} ${cx+W},${cy+Z}" fill="${col}" opacity=".45"/>`; }
  return `<svg class="art" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g stroke="var(--surface)" stroke-width="1" stroke-linejoin="round">${s}</g></svg>`;
}
const skillTag = s => `<span class="tag">${icon(s,15)}${esc(skillName(s,lang))}</span>`;
const langBadges = a => `<span class="lang-badges" title="${esc(t("langAvail")[a.languages.includes("fr")?"both":"en"])}"><b>EN</b>${a.languages.includes("fr")?'<b class="fr">FR</b>':""}</span>`;

function chip(group,val,label,ico=""){
  const id=`f-${group}-${String(val).replace(/[^a-z0-9]/gi,"-")}`;
  return `<label class="chip" for="${id}"><input type="checkbox" id="${id}" data-g="${group}" value="${esc(val)}"><span>${ico}${esc(label)}</span></label>`;
}
function buildFilters(){
  const keep = new Set([...document.querySelectorAll("#filters input:checked")].map(i=>i.id));
  $("#f-grade").innerHTML=[5,6,7,8,9,10].map(g=>chip("grades",g,g)).join("");
  $("#f-subj").innerHTML=["math","sci","both"].map(s=>chip("subj",s,t("subj")[s])).join("");
  const used=[...new Set(DB.activities.flatMap(a=>a.skills))].sort((a,b)=>skillName(a,lang).localeCompare(skillName(b,lang),lang));
  $("#f-skill").innerHTML=used.map(s=>chip("skills",s,skillName(s,lang),icon(s,15))).join("");
  $("#f-lang").innerHTML=chip("fr","1",t("frOnly"));
  keep.forEach(id=>{const el=document.getElementById(id); if(el) el.checked=true;});
  $("#skill-key").innerHTML=used.map(s=>`<li>${icon(s,20)}<span><strong>${esc(skillName(s,lang))}</strong> — ${esc(SKILLS[s]?SKILLS[s][lang+"_d"]:"")}</span></li>`).join("");
  document.querySelectorAll("#filters input[type=checkbox]").forEach(i=>i.onchange=e=>{
    const el=e.target, g=el.dataset.g;
    if(g==="fr") state.fr=el.checked; else { const v=g==="grades"?+el.value:el.value; el.checked?state[g].add(v):state[g].delete(v); }
    render();
  });
}
function hay(a){
  return [a.title.en,a.title.fr,a.summary.en,a.summary.fr,a.objectives.en,a.objectives.fr,(a.materials.en||[]).join(" "),(a.materials.fr||[]).join(" "),
    a.skills.map(s=>s+" "+skillName(s,"fr")).join(" "),a.concepts.join(" "),
    a.expectations.map(k=>{const e=DB.expectations[k]; return e?`${e.code} ${e.course} ${e.en} ${e.fr}`:""}).join(" ")].join(" ").toLowerCase();
}
function match(a){
  if(state.grades.size && !a.grades.some(g=>state.grades.has(g))) return false;
  if(state.subj.size && !state.subj.has(a.subject)) return false;
  if(state.skills.size && ![...state.skills].every(s=>a.skills.includes(s))) return false;
  if(state.fr && !a.languages.includes("fr")) return false;
  if(state.q && !a._hay.includes(state.q)) return false;
  return true;
}
function card(a){
  const n=a.expectations.length;
  return `<li class="card">
   <div class="thumb">${art(a)}<span class="badges"><span class="pill">${esc(t("subj")[a.subject])}</span>${langBadges(a)}</span></div>
   <div class="card-body">
     <span class="grades">${esc(gradesText(a.grades,lang))}</span>
     <h3><button type="button" data-id="${a.id}">${esc(pick(a.title))}</button></h3>
     <p>${esc(pick(a.summary))}</p>
     <div class="meta">${a.skills.map(skillTag).join("")}</div>
     <span class="foot">${esc(t("nExp")(n))}</span>
   </div></li>`;
}
function render(){
  const list=DB.activities.filter(match);
  $("#grid").innerHTML=list.map(card).join("");
  $("#empty").hidden=!!list.length;
  $("#count").innerHTML=t("showing")(list.length,DB.activities.length);
}
function expList(keys){
  return `<ul class="exp">${keys.map(k=>{const e=DB.expectations[k]; if(!e) return "";
    return `<li><a class="code ${e.subj}" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(expLabel(e,lang))}</a><span>${esc(e[lang]||e.en)}</span></li>`}).join("")}</ul>`;
}
function openDlg(id, push=true){
  const a=DB.activities.find(x=>x.id===id); if(!a) return;
  const dlg=$("#dlg");
  const sciK=a.expectations.filter(k=>DB.expectations[k]?.subj==="sci"), mathK=a.expectations.filter(k=>DB.expectations[k]?.subj==="math");
  const P=DB.processes;
  const procs=[...a.processes.sci.map(p=>`<span>${esc(t("sciProc"))}: ${esc(P.sci[p]?.[lang]||p)}</span>`), ...a.processes.math.map(p=>`<span>${esc(t("mathProc"))}: ${esc(P.math[p]?.[lang]||p)}</span>`)].join("");
  const links=a.links.length?`<div class="linkrow">${a.links.map((l,i)=>`<a class="btn${i===0?" primary":""}" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="lg">${l.lang.toUpperCase()}</span>${esc(l[lang]||l.en)} <span aria-hidden="true">↗</span></a>`).join("")}</div>`:`<p class="note">${esc(t("noLink"))}</p>`;
  const mats=(a.materials[lang]&&a.materials[lang].length?a.materials[lang]:a.materials.en)||[];
  dlg.innerHTML=`<div class="dlg-head"><div><h2 id="dlg-title">${esc(pick(a.title))}</h2>
     <p class="sub">${esc(gradesText(a.grades,lang))} · ${esc(t("subj")[a.subject])} · ${esc(t("type")[a.type])} · ${esc(t("langAvail")[a.languages.includes("fr")?"both":"en"])}</p></div>
     <button class="btn" type="button" id="dlg-close">${esc(t("close"))}</button></div>
   <div class="dlg-body">
     <p>${esc(pick(a.summary))}</p>
     <div><h3>${esc(t("resources"))}</h3>${links}${a.adaptedFrom?`<p class="note" style="margin-top:8px">${esc(t("adapted")(a.adaptedFrom))}</p>`:""}</div>
     <div class="row2">
       <div><h3>${esc(t("objectives"))}</h3><p>${esc(pick(a.objectives))}</p></div>
       <div><h3>${esc(t("materials"))}</h3><ul>${mats.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>${pick(a.prep)?`<p class="note" style="margin-top:8px"><strong>${esc(t("prep"))}:</strong> ${esc(pick(a.prep))}</p>`:""}</div>
     </div>
     <div><h3>${esc(t("skills"))}</h3><div class="meta">${a.skills.map(skillTag).join("")}</div></div>
     ${sciK.length?`<div><h3>${esc(t("sciExp"))}</h3>${expList(sciK)}</div>`:""}
     ${mathK.length?`<div><h3>${esc(t("mathExp"))}</h3>${expList(mathK)}</div>`:""}
     ${procs?`<div><h3>${esc(t("procs"))}</h3><div class="proc">${procs}</div></div>`:""}
     ${a.concepts.length?`<div><h3>${esc(t("concepts"))}</h3><p>${a.concepts.map(esc).join(" · ")}</p></div>`:""}
   </div>`;
  $("#dlg-close").onclick=()=>dlg.close();
  if(!dlg.open) dlg.showModal();
  if(push && location.hash!=="#"+id) history.replaceState(null,"","#"+id);
}
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t("title");
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t); if(typeof v==="string") el.innerHTML=v;});
  $("#q").placeholder=t("searchPh");
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  buildFilters(); render();
  const d=$("#dlg"); if(d.open){ const id=location.hash.slice(1); openDlg(id,false); }
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang; try{localStorage.setItem("spz-lang",lang)}catch(e){} applyLang();});
$("#dlg").addEventListener("close",()=>{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); });
$("#dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") e.target.close(); });
$("#grid").addEventListener("click",e=>{ const b=e.target.closest("[data-id]"); if(b) openDlg(b.dataset.id); });
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase(); render();});
$("#reset").onclick=()=>{ ["grades","subj","skills"].forEach(k=>state[k].clear()); state.fr=false; state.q=""; $("#q").value="";
  document.querySelectorAll("#filters input[type=checkbox]").forEach(i=>i.checked=false); render(); };
window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if(id) openDlg(id,false); });

fetch("data/activities.json",{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  DB=d; DB.activities.forEach(a=>a._hay=hay(a));
  $("#st-total").textContent=DB.activities.length;
  $("#st-exp").textContent=new Set(DB.activities.flatMap(a=>a.expectations)).size;
  $("#st-fr").textContent=DB.activities.filter(a=>a.languages.includes("fr")).length;
  applyLang();
  if(location.hash.length>1) openDlg(location.hash.slice(1),false);
}).catch(err=>{ $("#grid").innerHTML=`<li class="empty">The activity list couldn't load (data/activities.json). If you opened this file directly from your computer, view it through GitHub Pages instead.</li>`; });
</script>
</body>
</html>
